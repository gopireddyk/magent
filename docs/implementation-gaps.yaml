# ============================================================================
# QUICK START FOR AI IMPLEMENTATION
# ============================================================================
ai_implementation_guide:
  description: |
    Step-by-step guide for an AI agent to implement the project.

  step_1:
    action: "Read documentation"
    files:
      - "docs/project-structure.yaml"
      - "docs/naming-conventions.yaml"
      - "docs/external-dependencies.yaml"

  step_2:
    action: "Create directory structure"
    command: |
      mkdir -p src/research_assistant/{config,core,services,agents,tools,graph,ui/pages}
      mkdir -p tests/{unit,integration,fixtures}
      mkdir -p .streamlit

  step_3:
    action: "Implement Phase 1-5 (Core functionality)"
    reference: "docs/ai-agent-implementation-guide.yaml"
    reference2: "docs/ai-agent-implementation-guide-part2.yaml"

  step_4:
    action: "Implement Phase 6-7 (UI and CLI)"
    reference: "docs/ai-agent-implementation-guide-part3.yaml"

  step_5:
    action: "Implement Phase 8 (Tests)"
    reference: "docs/ai-agent-implementation-guide-part3.yaml#tests"

  step_6:
    action: "Verify implementation"
    commands:
      - "make install-dev"
      - "make verify-all"
      - "make lint"
      - "make test"
      - "make run"

  step_7:
    action: "Deploy"
    commands:
      - "make podman-build"
      - "make podman-compose-up"
      - "# OR for K8s:"
      - "make local-k8s-setup"
      - "make k8s-deploy"

