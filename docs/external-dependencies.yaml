# 12. QUICK START COMMANDS
# ============================================================================
quick_start:

  one_time_setup:
    description: "Run these commands once to set up the environment"
    commands:
      - "# 1. Install Ollama"
      - "curl -fsSL https://ollama.ai/install.sh | sh"
      - ""
      - "# 2. Download LLM model"
      - "ollama pull llama3.2"
      - ""
      - "# 3. Clone repository"
      - "git clone <repository-url>"
      - "cd student-research-assistant"
      - ""
      - "# 4. Create virtual environment"
      - "python -m venv venv"
      - "source venv/bin/activate  # Linux/macOS"
      - "# OR: .\\venv\\Scripts\\activate  # Windows"
      - ""
      - "# 5. Install dependencies"
      - "pip install -e '.[dev]'"
      - ""
      - "# 6. Copy environment file"
      - "cp .env.example .env"
      - ""
      - "# 7. Create data directories"
      - "mkdir -p data/documents data/vectorstore"

  daily_usage:
    description: "Commands for daily development"
    commands:
      - "# Activate environment"
      - "source venv/bin/activate"
      - ""
      - "# Start Ollama (if not running)"
      - "ollama serve &"
      - ""
      - "# Run the application"
      - "make run"
      - "# OR: streamlit run src/research_assistant/ui/app.py"

  makefile_shortcuts:
    description: "Use Makefile for common operations"
    commands:
      - "make install      # Install dependencies"
      - "make run          # Run the application"
      - "make test         # Run tests"
      - "make lint         # Run linters"
      - "make ollama-pull  # Download LLM models"
      - "make verify-deps  # Verify all dependencies"

